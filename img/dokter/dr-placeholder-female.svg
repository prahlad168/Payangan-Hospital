<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ecfeff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cffafe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e7490;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fde8d0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5cba7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)" rx="0"/>
  <!-- Body / jas dokter -->
  <ellipse cx="200" cy="370" rx="120" ry="80" fill="url(#body)"/>
  <rect x="80" y="290" width="240" height="110" fill="url(#body)" rx="10"/>
  <!-- Kerah putih -->
  <polygon points="200,290 170,260 230,260" fill="white" opacity="0.9"/>
  <!-- Stetoskop -->
  <path d="M155,310 Q140,340 150,360 Q160,375 175,370" stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="175" cy="370" r="8" fill="#22d3ee"/>
  <!-- Leher -->
  <rect x="178" y="235" width="44" height="55" fill="url(#skin)" rx="10"/>
  <!-- Kepala -->
  <ellipse cx="200" cy="210" rx="68" ry="72" fill="url(#skin)"/>
  <!-- Rambut -->
  <ellipse cx="200" cy="155" rx="68" ry="40" fill="#4a3728"/>
  <rect x="132" y="155" width="18" height="55" fill="#4a3728" rx="9"/>
  <rect x="250" y="155" width="18" height="55" fill="#4a3728" rx="9"/>
  <ellipse cx="200" cy="148" rx="68" ry="30" fill="#5c4033"/>
  <!-- Mata kiri -->
  <ellipse cx="178" cy="210" rx="9" ry="7" fill="white"/>
  <circle cx="178" cy="210" r="5" fill="#3d2b1a"/>
  <circle cx="180" cy="208" r="2" fill="white"/>
  <!-- Mata kanan -->
  <ellipse cx="222" cy="210" rx="9" ry="7" fill="white"/>
  <circle cx="222" cy="210" r="5" fill="#3d2b1a"/>
  <circle cx="224" cy="208" r="2" fill="white"/>
  <!-- Alis -->
  <path d="M168,200 Q178,196 188,200" stroke="#3d2b1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M212,200 Q222,196 232,200" stroke="#3d2b1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Hidung -->
  <path d="M197,218 Q200,228 203,218" stroke="#c8956c" stroke-width="1.5" fill="none"/>
  <!-- Senyum -->
  <path d="M185,232 Q200,242 215,232" stroke="#c8956c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Badge dokter -->
  <rect x="215" y="305" width="55" height="22" fill="white" rx="5" opacity="0.9"/>
  <text x="242" y="321" font-family="Arial" font-size="9" fill="#0891b2" text-anchor="middle" font-weight="bold">DOKTER</text>
</svg>
